- id: glm-pluggable-layer-register-oot
  kind: method
  target: vllm.model_executor.custom_op:PluggableLayer.register_oot
  why: registers the fork KDA layer under 'Glm5NextLinearAttention' and asserts on a second registration, so register_glm_layers checks op_registry_oot first
  sha256: 1a0f3e28a1dd426691be00d91c1ab461c45c8c030d2a65ee011d537e51a9c03a
  signature: '(_decorated_layer_cls=None, name: str | None = None)'

- id: glm-pluggable-layer-registry
  kind: module_attr
  target: vllm.model_executor.custom_op:op_registry_oot
  why: the out-of-tree layer table register_glm_layers reads and fills
  type: dict

- id: glm-kda-init
  kind: method
  target: vllm.models.glm5next.common.kda:Glm5NextLinearAttention.__init__
  why: the fork layer sets its decode, RecoverSSM and KDA prefill attributes after it; it reads local_num_heads, head_dim, kda_prefill_backend, kda_safe_gate, kda_lower_bound and allocates nothing after the point where that code sat
  sha256: e5f80788808e94055721ada8af59c089c9b357b88027c9f449654f5260668ae8
  signature: '(self, config: transformers.models.glm5_next.configuration_glm5_next.Glm5NextTextConfig, vllm_config: vllm.config.vllm.VllmConfig, prefix: str = '''') -> None'

- id: glm-kda-get-kv-cache-spec
  kind: method
  target: vllm.models.glm5next.common.kda:Glm5NextLinearAttention.get_kv_cache_spec
  why: returns the GDN spec with the prefill checkpoint fields; the fork layer replaces num_speculative_blocks with 0 on top under RecoverSSM
  sha256: 7b35c15494e3ab6ccacc8fef28ff148e3ecc4a0e63a95afd1e0ff8910a81ad3e
  signature: '(self, vllm_config: vllm.config.vllm.VllmConfig) -> vllm.v1.kv_cache_interface.MambaSpec'

- id: glm-kda-forward
  kind: method
  target: vllm.models.glm5next.common.kda:Glm5NextLinearAttention.forward
  why: reads _kda_v2, which the fork layer sets, to defer f_b_proj / g_b_proj to the fused decode step
  sha256: c365deda35bdd0ee074959e66cd7bd42349a37564af7b8fd5a1128b5908cb481
  signature: '(self, hidden_states: torch.Tensor, positions: torch.Tensor) -> torch.Tensor'

- id: glm-kda-forward-core
  kind: method
  target: vllm.models.glm5next.common.kda:Glm5NextLinearAttention._forward_core
  why: reads the fork layer's _kda_recover, _kda_recover_records, _kda_step_tile, _kda_wide, _pp_kda_prefill and _fill_deferred_g2, and the metadata's spec_max_query_len
  sha256: 1a483f608bff9a44a93fc19b2cd21247b16fb33c27212a39ecc348bff11fdda4
  signature: '(self, qkv_proj_states: torch.Tensor, g1: torch.Tensor | None, beta: torch.Tensor, core_attn_out: torch.Tensor, g2: torch.Tensor | None = None, f_a: torch.Tensor | None = None, g_a: torch.Tensor | None = None) -> bool'

- id: glm-mamba-get-attn-backend
  kind: method
  target: vllm.model_executor.layers.mamba.abstract:MambaBase.get_attn_backend
  why: KV cache groups and metadata builders take the backend from the layer; the fork KDA layer returns its GDN backend subclass
  sha256: 0cb9b60612e129f49aac228a8103cc0349a3f28db3b928ac14252945ff262a8b
  signature: (self) -> type[vllm.v1.attention.backend.AttentionBackend]

- id: glm-gdn-backend-builder
  kind: method
  target: vllm.v1.attention.backends.gdn_attn:GDNAttentionBackend.get_builder_cls
  why: the fork backend overrides only the builder class and keeps the name GDN_ATTN
  sha256: 8ceae13103d27df349027b9f4359c39c68363647bec5f51c4be7ab287851d695
  signature: () -> type['GDNAttentionMetadataBuilder']

- id: glm-gdn-builder-init
  kind: method
  target: vllm.v1.attention.backends.gdn_attn:GDNAttentionMetadataBuilder.__init__
  why: the fork builder creates the RecoverSSM state after it, where the base did; reads use_spec_decode and sets supports_update_block_table
  sha256: 044b7a3e27fc68396cb4588f31415d140681b6cfec3cf0bca0a8ae2d3a8ea477
  signature: '(self, kv_cache_spec: vllm.v1.kv_cache_interface.MambaSpec, layer_names: list[str], vllm_config: vllm.config.vllm.VllmConfig, device: torch.device)'

- id: glm-gdn-builder-build
  kind: method
  target: vllm.v1.attention.backends.gdn_attn:GDNAttentionMetadataBuilder.build
  why: returns a new GDNAttentionMetadata and leaves common_attn_metadata as passed; num_spec_decodes and spec_sequence_masks_cpu are its fields, so the fork builder can copy it into the GLM metadata, add the bound and wrap RecoverSSM
  sha256: 34d311c83ad6fb6918296a9c770820d504f008f5bf2f767b3909adab6d629788
  signature: '(self, common_prefix_len: int, common_attn_metadata: vllm.v1.attention.backend.CommonAttentionMetadata, num_accepted_tokens: torch.Tensor | None = None, num_decode_draft_tokens_cpu: torch.Tensor | None = None, fast_build: bool = False) -> vllm.v1.attention.backends.gdn_attn.GDNAttentionMetadata'

- id: glm-gdn-builder-capture
  kind: method
  target: vllm.v1.attention.backends.gdn_attn:GDNAttentionMetadataBuilder.build_for_cudagraph_capture
  why: builds through self.build, so capture metadata also carries the bound and the RecoverSSM wrap
  sha256: 3e5eb80ae7857b356af75f0b312a25881cc290d1add86e2b9da9c2132f56797a
  signature: '(self, common_attn_metadata: vllm.v1.attention.backend.CommonAttentionMetadata)'

- id: glm-gdn-builder-update-block-table
  kind: method
  target: vllm.v1.attention.backends.gdn_attn:GDNAttentionMetadataBuilder.update_block_table
  why: reuses metadata with dataclasses.replace, which keeps the GLM metadata class and its bound; not used under RecoverSSM
  sha256: 602fd9598219af48107319dbfc39efcbf37ec24977e653f684f5dbf9ec4bf128
