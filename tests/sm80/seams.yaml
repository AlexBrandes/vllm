- id: glm-registry-lazy-modelinfo-hash
  kind: method
  target: vllm.model_executor.models.registry:_LazyRegisteredModel._get_modelinfo_module_hash
  why: keys the cached model information on the module file, or on the whole package for a package __init__.py; PackageHashedLazyModel passes the model package's __init__.py so the upstream GLM code is covered
