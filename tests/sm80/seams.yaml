#
# Upstream seams the sm80 fork code relies on without editing them.
# Checked by tests/sm80/test_seams.py. After checking an upstream change to
# a seam, rewrite the pins with: python tests/sm80/update_seams.py [ID ...]
#
# Fields:
#   id         unique row name
#   kind       function | method | class_attr | module_attr | dict_contract
#   target     'module:qualname'
#   why        what the fork code depends on
#   sha256     sha256 of textwrap.dedent(inspect.getsource(obj)) (code kinds)
#   signature  str(inspect.signature(obj)) (code kinds)
#   type       type name of the value (attr kinds and dict_contract)
#   value      exact value, for constants only (attr kinds, optional)
#   dict_contract rows also require every value to be a zero-arg callable.

seams:

- id: glm-registry-register-model
  kind: method
  target: vllm.model_executor.models.registry:_ModelRegistry.register_model
  why: an architecture registered again is overwritten, so the plugin's lazy '<module>:<class>' entries replace the upstream GLM classes without importing them
  sha256: 2108e0880380f00cb5838afe4ad00b2cf087503c71b9fad36ca7223762efc76f
  signature: '(self, model_arch: str, model_cls: type[torch.nn.modules.module.Module] | str) -> None'

- id: glm-registry-model-info
  kind: method
  target: vllm.model_executor.models.registry:_ModelInfo.from_model_cls
  why: model information is read from the registered class (architecture = class name, interface flags); the fork GLM classes keep the upstream names and bases so it stays the same
  sha256: 8a7552442685b80f233c128f071a5d0c14361dd78b68b76e0b0f62f70d4527b9
  signature: '(model: type[torch.nn.modules.module.Module]) -> ''_ModelInfo'''

- id: glm-model-init
  kind: method
  target: vllm.models.glm5next.common.model:Glm5NextModel.__init__
  why: fork Glm5NextModel.adopt takes the upstream-built backbone; it reads config (mhc, hc_mult, hidden_size, aux_hidden_state_tensor) and replaces the embed_tokens PPMissingLayer in place; the copied forward reads layers/_active_layers, norm, is_sequence_parallel, device
  sha256: b9516f97fa30b71d17f17c6360b153f0dccb5ae6daa16bb4c6fe09cb633510a9
  signature: '(self, *, vllm_config: vllm.config.vllm.VllmConfig, prefix: str = '''')'

- id: glm-model-forward
  kind: method
  target: vllm.models.glm5next.common.model:Glm5NextModel.forward
  why: fork Glm5NextModel.forward is this method plus the pipeline boundary and aux hidden state code; an upstream change here must be carried into the copy
  sha256: 51c7547878c942777d0b1c5855fcfff27c99f4225b996f588e964a719671d43f
  signature: '(self, input_ids: torch.Tensor | None, positions: torch.Tensor, intermediate_tensors: vllm.sequence.IntermediateTensors | None, inputs_embeds: torch.Tensor | None = None, **kwargs) -> torch.Tensor'

- id: glm-causal-lm-init
  kind: method
  target: vllm.models.glm5next.common.model:Glm5NextForCausalLM.__init__
  why: builds self.model = Glm5NextModel(prefix 'model') first, then lm_head and logits_processor; the fork class builds the drafter embedding before it and adopts self.model after it
  sha256: 6d257992c893501adcf4c1836290ebff7d52972f074747c322d057009a4a4645
  signature: '(self, *, vllm_config: vllm.config.vllm.VllmConfig, prefix: str = '''')'

- id: glm-causal-lm-forward
  kind: method
  target: vllm.models.glm5next.common.model:Glm5NextForCausalLM.forward
  why: hands intermediate_tensors to self.model and returns its output (IntermediateTensors or the aux hidden state tuple) unchanged
  sha256: f6cb276d2f47a0fbb0c07aa8c48b99bed393de8d0139a08d3a0c8c871f1796aa
  signature: '(self, input_ids: torch.Tensor | None, positions: torch.Tensor, intermediate_tensors: vllm.sequence.IntermediateTensors | None = None, inputs_embeds: torch.Tensor | None = None, **kwargs) -> torch.Tensor | vllm.sequence.IntermediateTensors'

- id: glm-conditional-init
  kind: method
  target: vllm.models.glm5next.common.model:Glm5NextForConditionalGeneration.__init__
  why: builds language_model through the registry under 'Glm5NextForCausalLM' (so it is the fork text model) and aliases nothing for PP; the fork wrapper adds the alias after it
  sha256: 7fc1f4469599236ae305b0fffb2a995945aa2c8ce1197fd9f47aa642edbed876
  signature: '(self, *, vllm_config: vllm.config.vllm.VllmConfig, prefix: str = '''')'

- id: glm-glm4v-forward
  kind: method
  target: vllm.model_executor.models.glm4_1v:Glm4vForConditionalGeneration.forward
  why: the GLM wrapper inherits this forward, which passes intermediate_tensors to language_model.model and returns its pipeline boundary tensors unchanged
  sha256: 4625e51cd4205a0be8d7ad57621ca3ff64a649fd7cac37b6f63d081032f8aeec
  signature: '(self, input_ids: torch.Tensor | None, positions: torch.Tensor, intermediate_tensors: vllm.sequence.IntermediateTensors | None = None, inputs_embeds: torch.Tensor | None = None, **kwargs: object) -> torch.Tensor | vllm.sequence.IntermediateTensors'

- id: glm-decoder-layer-forward
  kind: method
  target: vllm.models.glm5next.common.model:Glm5NextDecoderLayer.forward
  why: returns (hidden_states, residual, post, comb) with hc_post deferred to the next layer; the fork forward captures aux states and materializes the boundary streams from that tuple
  sha256: 39c77ae8d0ed88beb96d56093c0d4385d8f17648319d99e500de548b824180a9
  signature: '(self, positions: torch.Tensor, hidden_states: torch.Tensor, residual: torch.Tensor | None = None, post: torch.Tensor | None = None, comb: torch.Tensor | None = None) -> tuple[torch.Tensor, torch.Tensor | None, torch.Tensor | None, torch.Tensor | None]'

- id: glm-decoder-layer-hc-post
  kind: method
  target: vllm.models.glm5next.common.model:Glm5NextDecoderLayer.hc_post
  why: applies the deferred mHC post state without consuming it; used for aux capture and the pipeline boundary
  sha256: 28d25abf781d29fbf58ffe909dd6ea341c9756ddfb427862e987d2cc1cd9f0ba
  signature: '(self, x: torch.Tensor, residual: torch.Tensor, post: torch.Tensor, comb: torch.Tensor)'

- id: glm-mhc-contract
  kind: function
  target: vllm.model_executor.layers.mhc:hc_contract
  why: contracts the residual streams into the [tokens, hidden] aux hidden state
  sha256: 9437034b4e7185d4621c72bb36d99cbfff02d738c9bef42ee59948ce2af5ba5b
  signature: '(x: torch.Tensor, n: int) -> torch.Tensor'

- id: glm-eagle-pack-aux
  kind: method
  target: vllm.model_executor.models.interfaces:EagleModelMixin.pack_local_aux_hidden_states
  why: the fork backbone packs its stage's aux states into the boundary tensors under these keys
  sha256: 155345681f117e1d908d00295c44969cde4eecf25106f222c1a6c4c030f72543
  signature: '(self, aux_hidden_states: list[torch.Tensor]) -> dict[str, torch.Tensor]'

- id: glm-eagle-collect-aux
  kind: method
  target: vllm.model_executor.models.interfaces:EagleModelMixin.collect_remote_aux_hidden_states
  why: the last stage collects the aux states of earlier stages before its own
  sha256: 3248f43418e3e080386fb4a89fed7b7e80ee0f56d56fb495b0eaa691ce7de2d4
  signature: '(self, intermediate_tensors: ''IntermediateTensors | None'') -> list[torch.Tensor]'

- id: glm-eagle-aux-layout
  kind: method
  target: vllm.model_executor.models.interfaces:EagleModelMixin._cache_aux_pp_layout
  why: sets _aux_slot_base_cached / _aux_upstream_total_cached, which the drafter fc fold reads and resets
  sha256: ebc85c4663e3661595f5b1754e1fb2e0acc76cd504fca824a6ef73b7b537f8fe
  signature: (self) -> None

- id: glm-spec-needs-target-embed
  kind: function
  target: vllm.model_executor.models.utils:spec_decode_needs_target_embed
  why: decides when the last pipeline stage builds the target embedding for its drafter
  sha256: b67f5776a6b810f85082b54615c2510d8b40ec3465dd73921b57532bb74dc738
  signature: '(vllm_config: vllm.config.vllm.VllmConfig, *, include_mtp: bool = False) -> bool'

- id: glm-logits-processor-forward
  kind: method
  target: vllm.model_executor.layers.logits_processor:LogitsProcessor.forward
  why: compute_logits_local calls it with skip_gather=True for this rank's vocab shard
  sha256: 8d59778d071858e84cbd263207ebc0b2ef96e54cee5e8a37912ce1b02b02ba57
  signature: '(self, lm_head: vllm.model_executor.layers.vocab_parallel_embedding.VocabParallelEmbedding, hidden_states: torch.Tensor, embedding_bias: torch.Tensor | None = None, skip_gather: bool = False) -> torch.Tensor | None'

- id: glm-model-state-resolve
  kind: function
  target: vllm.v1.worker.gpu.model_states:resolve_model_state_cls
  why: a model with get_model_state_cls picks its own ModelState before the hybrid default; the fork GLM classes return Glm5NextModelState, a MambaHybridModelState subclass, which is what hybrid GLM gets otherwise
  sha256: c330e5807024a93a386d378275e87a317702f9ba54ba4aeeaa4d50085245cefc
  signature: '(vllm_config: vllm.config.vllm.VllmConfig, model: torch.nn.modules.module.Module) -> type[vllm.v1.worker.gpu.model_states.interface.ModelState]'

- id: glm-mamba-state-init
  kind: method
  target: vllm.v1.worker.gpu.model_states.mamba_hybrid:MambaHybridModelState.__init__
  why: sets self.recoverssm from cache_config.use_kda_recoverssm and nothing later in __init__ reads it, so Glm5NextModelState can enable it after super().__init__()
  sha256: 7db729e148b53a7ab3e9b2cb6250a731017cf1aeec6b44028e581f3e31ca784c
  signature: '(self, vllm_config: vllm.config.vllm.VllmConfig, model: torch.nn.modules.module.Module, encoder_cache: vllm.v1.worker.gpu.mm.encoder_cache.EncoderCache | None, device: torch.device) -> None'

- id: glm-mamba-state-prepare-attn
  kind: method
  target: vllm.v1.worker.gpu.model_states.mamba_hybrid:MambaHybridModelState.prepare_attn
  why: records the RecoverSSM step through self.recoverssm when it is set
  sha256: ec8fd9de540091a759ffd0fd4565c3f31ee17f0b167b1f10a78a0b410de7b9da
  signature: '(self, input_batch: vllm.v1.worker.gpu.input_batch.InputBatch, cudagraph_mode: vllm.config.compilation.CUDAGraphMode, block_tables: tuple[torch.Tensor, ...], slot_mappings: torch.Tensor, attn_groups: list[list[vllm.v1.worker.utils.AttentionGroup]], kv_cache_config: vllm.v1.kv_cache_interface.KVCacheConfig, for_capture: bool = False, ubatch_idx: int = 0, model_specific_attn_metadata: vllm.v1.worker.gpu.model_states.interface.ModelSpecificAttnMetadata | None = None) -> dict[str, typing.Any]'

- id: glm-mamba-state-postprocess
  kind: method
  target: vllm.v1.worker.gpu.model_states.mamba_hybrid:MambaHybridModelState.postprocess_state
  why: commits the RecoverSSM step through self.recoverssm when it is set
  sha256: f581d70d6392742d05033727fa97c65b9810f735e7bb68fe0621f2202b0e6012
  signature: '(self, idx_mapping: torch.Tensor, num_sampled: torch.Tensor | int, num_computed_tokens: torch.Tensor | None = None) -> None'

- id: glm-recoverssm-state-init
  kind: method
  target: vllm.v1.worker.gpu.model_states.recoverssm:RecoverSSMState.__init__
  why: constructed without arguments and without allocations, so creating it after the base __init__ changes no allocation order
  sha256: 2d1f22e96d183dccf267fe9a8075c38fad2829208b065246534e2bea94c601ef
  signature: (self) -> None

- id: glm-pluggable-layer-new
  kind: method
  target: vllm.model_executor.custom_op:PluggableLayer.__new__
  why: building the upstream Glm5NextLinearAttention looks up op_registry_oot by the class name and builds the registered fork layer instead
  sha256: 4ddc43f6f857795414a20c494f12237e0243df420f35b0da6f39ea8af65e73da
