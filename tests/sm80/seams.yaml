  why: whole upstream class the fork Glm5NextForConditionalGeneration extends (bases, class attributes and methods it inherits)
  sha256: 787070d71f3aabe1166407a9a880b0cdb4eb56eeb190ca063ded2775d74a596a
  signature: '(*, vllm_config: vllm.config.vllm.VllmConfig, prefix: str = '''')'

- id: envs-getattr
  kind: function
  target: vllm.envs:__getattr__
  why: envs.X resolves lazily by calling environment_variables[X](), so fork vars registered into that dict are visible as attributes
  sha256: a319bb0641bb596ee33c8fde90f0de66ef2a8edb369cd4a3e623b37c9f7a5118
