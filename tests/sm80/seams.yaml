- id: envs-environment-variables
  kind: dict_contract
  target: vllm.envs:environment_variables
  why: register_env_vars adds fork vars to this module-level dict of name -> zero-arg callable
  type: dict

- id: envs-enable-envs-cache
  kind: function
  target: vllm.envs:enable_envs_cache
  why: caching wraps __getattr__ and evaluates every key of environment_variables, including fork vars
  sha256: e3d0100779c0508a0254f7c25d929a23503619ed2068edbb53318e744503f585
  signature: () -> None

- id: envs-is-set
  kind: function
  target: vllm.envs:is_set
  why: is_set accepts only names present in environment_variables, so fork vars must be registered there
  sha256: 4004f3c33b0b9bc98e682dd1e954c4214712b9b03b9ca4f61a7b16b8fbdca10a
  signature: '(name: str)'

- id: envs-dir
  kind: function
  target: vllm.envs:__dir__
  why: dir(vllm.envs) lists the keys of environment_variables, including fork vars
  sha256: c03e7a797275386e606ab7c5ded3b3817e4c4a06f541b068cdde33e1de8ab52d
  signature: ()

- id: envs-compile-factors
  kind: function
  target: vllm.envs:compile_factors
  why: compile cache keys iterate environment_variables, so fork vars enter the hash unless listed as ignored
  sha256: 9d429d5b576ecfa3c0011109bd46a010f34bc482c65479a0fe0ed7b5ef1ee4fb
  signature: () -> dict[str, object]

- id: config-hash-factors
  kind: function
  target: vllm.config.utils:hash_factors
  why: compile_factors output is hashed as sort_keys JSON, so the order fork vars are registered in does not change the key
  sha256: 9727a36e8d4eaffc0d6503e64da3a422f8668fe58ef4a13225c7f508538d30da
  signature: '(items: dict[str, object]) -> str'

- id: platform-validate-environ
  kind: method
  target: vllm.platforms.interface:Platform.validate_environ
  why: VLLM_* variables absent from environment_variables are reported as unknown, so fork vars must be registered before it runs
  sha256: 650309453187a6bc06552fa1deee176a30983aedeeecd0bc60f1e4fa8d3f91af
  signature: '(hard_fail: bool) -> None'

- id: plugins-load-plugins-by-group
  kind: function
