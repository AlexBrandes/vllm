- id: sched-scheduler-reserve-prefill-lookahead
  kind: method
  target: vllm.v1.core.sched.scheduler:Scheduler._reserve_prefill_lookahead
  why: refuses to end a chunk within num_prefill_lookahead of the prefill end; the fair-prefill budgets are floored at num_prefill_lookahead + 1 so a chunk can always end
