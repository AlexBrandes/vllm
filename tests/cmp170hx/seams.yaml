  signature: '(self, idx_mapping: torch.Tensor, num_sampled: torch.Tensor | int, num_computed_tokens: torch.Tensor | None = None) -> None'

- id: glm-recoverssm-state-init
  kind: method
  target: vllm.v1.worker.gpu.model_states.recoverssm:RecoverSSMState.__init__
  why: constructed without arguments and without allocations, so creating it after the base __init__ changes no allocation order
  sha256: 2d1f22e96d183dccf267fe9a8075c38fad2829208b065246534e2bea94c601ef
