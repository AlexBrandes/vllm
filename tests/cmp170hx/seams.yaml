  why: fair prefill passes the align-mode chunk ceiling as its fifth argument (prefill_limit), the Mamba state grid comes from vllm_cmp170hx.sched.hooks.mamba_block_size, and a block wider than one chunk is cut by vllm_cmp170hx.sched.hooks.mamba_subblock_end
