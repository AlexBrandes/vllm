- id: glm-eagle-collect-aux
  kind: method
  target: vllm.model_executor.models.interfaces:EagleModelMixin.collect_remote_aux_hidden_states
  why: the last stage collects the aux states of earlier stages before its own
  sha256: 3248f43418e3e080386fb4a89fed7b7e80ee0f56d56fb495b0eaa691ce7de2d4
  signature: '(self, intermediate_tensors: ''IntermediateTensors | None'') -> list[torch.Tensor]'

- id: glm-eagle-aux-layout
  kind: method
  target: vllm.model_executor.models.interfaces:EagleModelMixin._cache_aux_pp_layout
  why: sets _aux_slot_base_cached / _aux_upstream_total_cached, which the drafter fc fold reads and resets
  sha256: ebc85c4663e3661595f5b1754e1fb2e0acc76cd504fca824a6ef73b7b537f8fe
  signature: (self) -> None

- id: glm-spec-needs-target-embed
  kind: function
  target: vllm.model_executor.models.utils:spec_decode_needs_target_embed
