  kind: method
  target: vllm.models.glm5next.common.kda:Glm5NextLinearAttention.__init__
  why: the fork layer sets its decode, RecoverSSM and KDA prefill attributes after it; it reads local_num_heads, head_dim, kda_prefill_backend, kda_safe_gate, kda_lower_bound and allocates nothing after the point where that code sat
  sha256: 1c942e5b2c32c9cd7320e5f27d7d66de7d3b4e507fd4f7bd2c4ba712b971804a
  signature: '(self, config: transformers.models.glm5_next.configuration_glm5_next.Glm5NextTextConfig, vllm_config: vllm.config.vllm.VllmConfig, prefix: str = '''') -> None'

- id: glm-kda-get-kv-cache-spec
  kind: method
  target: vllm.models.glm5next.common.kda:Glm5NextLinearAttention.get_kv_cache_spec
  why: returns the GDN spec with the prefill checkpoint fields; the fork layer replaces num_speculative_blocks with 0 on top under RecoverSSM
  sha256: 7b35c15494e3ab6ccacc8fef28ff148e3ecc4a0e63a95afd1e0ff8910a81ad3e
  signature: '(self, vllm_config: vllm.config.vllm.VllmConfig) -> vllm.v1.kv_cache_interface.MambaSpec'

- id: glm-kda-forward
  kind: method
  target: vllm.models.glm5next.common.kda:Glm5NextLinearAttention.forward
  why: hands the rest of the layer (f_b_proj / g_b_proj, core_attn_out, _forward, o_norm, o_proj) to the fork layer's sm80_forward_tail(hidden_states, qkv, beta, f_a, g_a) right after the input projections; sm80_forward_tail is this method's tail with the deferred projections and the norm inside _forward, so a change to the tail must be carried into it
  sha256: 1534a7ff9ea6f7a79974521d0cbe2a8c735a18cbb916e7cad69b23966b0e10fa
  signature: '(self, hidden_states: torch.Tensor, positions: torch.Tensor) -> torch.Tensor'

- id: glm-kda-forward-body
  kind: method
  target: vllm.models.glm5next.common.kda:Glm5NextLinearAttention._forward
  why: the fork layer's _forward runs it nested in its own eager break after _kda_deferred_step, which mirrors its metadata, cache, conv-state layout and merged conv weight reads; it reads the fork layer's _kda_mixed (spec-row conv skipped, spec rows from that callable) and sm80_chunk_kda (the chunked prefill call)
  sha256: 8f2620306c9803246b705ac4eb9c3bb57f138e7761228d0f386237ba555d0a76
  signature: '(self, qkv_proj_states: torch.Tensor, g1: torch.Tensor, beta: torch.Tensor, core_attn_out: torch.Tensor) -> None'

