  sha256: df0e00d8870e171342c8bc1c43240879d5c08b9b0ac1b46d73e3e3f49e0e1566
  signature: '(self, scheduler_output: vllm.v1.core.sched.output.SchedulerOutput, model_runner_output: vllm.v1.outputs.ModelRunnerOutput) -> dict[int, vllm.v1.engine.EngineCoreOutputs]'

