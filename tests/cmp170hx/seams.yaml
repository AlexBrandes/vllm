#
# Upstream seams the fork code relies on without editing them, pinned as
# one upstream base has them (seams.yaml: the base in FORK.md;
# seams.<base12>.yaml: the re-pin for another base).
# Checked by tests/cmp170hx/test_seams.py. After checking an upstream change to
# a seam, rewrite the pins with: python tests/cmp170hx/update_seams.py [ID ...]
#
# Fields:
#   id         unique row name
#   kind       function | method | class_attr | module_attr | dict_contract
#   target     'module:qualname'
#   why        what the fork code depends on
#   sha256     sha256 of textwrap.dedent(inspect.getsource(obj)) (code kinds)
#   signature  str(inspect.signature(obj)), object addresses removed (code kinds)
#   type       type name of the value (attr kinds and dict_contract)
#   value      exact value, for constants only (attr kinds, optional)
#   dict_contract rows also require every value to be a zero-arg callable.

seams:

- id: plugins-load-general-plugins
  kind: function
  target: vllm.plugins:load_general_plugins
  why: guard.check_plugin_loaded reads plugins_loaded as "this process loaded the general plugins"; load_general_plugins sets it once, before it calls each plugin's register
  sha256: 59a85a7fa0b075b7569780e4184541365405b9d087de9802ad8d418adf8e010c
  signature: ()

- id: plugins-loaded-flag
  kind: module_attr
  target: vllm.plugins:plugins_loaded
  why: guard.check_plugin_loaded reads this module-level bool
  type: bool

- id: plugins-load-plugins-by-group
  kind: function
  target: vllm.plugins:load_plugins_by_group
  why: the VLLM_PLUGINS filter and the log-and-ignore of a plugin that fails to load, which the guard's error message names
  sha256: 629f5a97f1674951faf5777570b3da05ef2a4a77b5db8118049ccf7b23ac6872
  signature: '(group: str) -> dict[str, collections.abc.Callable[[], typing.Any]]'

- id: sched-get-request-counts
  kind: method
  target: vllm.v1.core.sched.scheduler:Scheduler.get_request_counts
  why: sched.prefill_budget counts prompts awaiting prefill as the waiting count it returns plus the running prefill chunks
  sha256: 865230b6ad6cebfee99e9a7c96aa93fdf1bf1c18c766f43ea2499e29e223c231
  signature: (self) -> tuple[int, int]

- id: glm-registry-register-model
  kind: method
  target: vllm.model_executor.models.registry:_ModelRegistry.register_model
  why: an architecture registered again is overwritten, so the plugin's lazy '<module>:<class>' entries replace the upstream GLM classes without importing them
  sha256: 2108e0880380f00cb5838afe4ad00b2cf087503c71b9fad36ca7223762efc76f
  signature: '(self, model_arch: str, model_cls: type[torch.nn.modules.module.Module] | str) -> None'

- id: glm-registry-model-info
  kind: method
  target: vllm.model_executor.models.registry:_ModelInfo.from_model_cls
  why: model information is read from the registered class (architecture = class name, interface flags); the fork GLM classes keep the upstream names and bases so it stays the same
  sha256: 31f31a90d3e7413a835a288fa7996a2a4b47f6d980a2cda31f58b1717728ada3
  signature: '(model: type[torch.nn.modules.module.Module]) -> ''_ModelInfo'''

- id: glm-model-init
  kind: method
  target: vllm.models.glm5next.common.model:Glm5NextModel.__init__
  why: fork Glm5NextModel.adopt takes the upstream-built backbone; it reads config (mhc, hc_mult, hidden_size, aux_hidden_state_tensor) and replaces the embed_tokens PPMissingLayer in place; the copied forward reads layers/_active_layers, norm, is_sequence_parallel, device; upstream's _aux_post_op is built but unused by the copied forward
  sha256: b401dfe8638958711fb9b83da4109df1d3394a2f0b66f24a51c4406aea98969a
  signature: '(self, *, vllm_config: vllm.config.vllm.VllmConfig, prefix: str = '''')'

- id: glm-model-forward
  kind: method
  target: vllm.models.glm5next.common.model:Glm5NextModel.forward
  why: fork Glm5NextModel.forward is this method plus the pipeline boundary, the aux_hidden_state_tensor choice and the drafter fc fold; its aux capture replaces upstream's _aux_hidden_state at the same positions (aux layer id i = the state after layer i - 1, plus end_layer) but contracts by hc_mult; an upstream change here must be carried into the copy
  sha256: 7617754e7c91e47f0a3ba90aa487af709126cece024b6b26a72925a6ff944aba
  signature: '(self, input_ids: torch.Tensor | None, positions: torch.Tensor, intermediate_tensors: vllm.sequence.IntermediateTensors | None, inputs_embeds: torch.Tensor | None = None, **kwargs) -> torch.Tensor'

- id: glm-causal-lm-init
  kind: method
  target: vllm.models.glm5next.common.model:Glm5NextForCausalLM.__init__
  why: builds self.model = Glm5NextModel(prefix 'model') first, then lm_head and logits_processor; the fork class builds the drafter embedding before it and adopts self.model after it
  sha256: 6d257992c893501adcf4c1836290ebff7d52972f074747c322d057009a4a4645
  signature: '(self, *, vllm_config: vllm.config.vllm.VllmConfig, prefix: str = '''')'

- id: glm-causal-lm-forward
  kind: method
  target: vllm.models.glm5next.common.model:Glm5NextForCausalLM.forward
  why: hands intermediate_tensors to self.model and returns its output (IntermediateTensors or the aux hidden state tuple) unchanged
  sha256: f6cb276d2f47a0fbb0c07aa8c48b99bed393de8d0139a08d3a0c8c871f1796aa
  signature: '(self, input_ids: torch.Tensor | None, positions: torch.Tensor, intermediate_tensors: vllm.sequence.IntermediateTensors | None = None, inputs_embeds: torch.Tensor | None = None, **kwargs) -> torch.Tensor | vllm.sequence.IntermediateTensors'

- id: glm-conditional-init
  kind: method
  target: vllm.models.glm5next.common.model:Glm5NextForConditionalGeneration.__init__
  why: builds language_model through the registry under 'Glm5NextForCausalLM' (so it is the fork text model) and aliases nothing for PP; the fork wrapper adds the alias after it
  sha256: 8a24aee0f80b107b42ff379aef8a4c27b67e590e7def5b256e83cf02de133b66
  signature: '(self, *, vllm_config: vllm.config.vllm.VllmConfig, prefix: str = '''')'

- id: glm-glm4v-forward
  kind: method
  target: vllm.model_executor.models.glm4_1v:Glm4vForConditionalGeneration.forward
  why: the GLM wrapper inherits this forward, which passes intermediate_tensors to language_model.model and returns its pipeline boundary tensors unchanged
  sha256: 4625e51cd4205a0be8d7ad57621ca3ff64a649fd7cac37b6f63d081032f8aeec
  signature: '(self, input_ids: torch.Tensor | None, positions: torch.Tensor, intermediate_tensors: vllm.sequence.IntermediateTensors | None = None, inputs_embeds: torch.Tensor | None = None, **kwargs: object) -> torch.Tensor | vllm.sequence.IntermediateTensors'

- id: glm-decoder-layer-forward
  kind: method
  target: vllm.models.glm5next.common.model:Glm5NextDecoderLayer.forward
  why: returns (hidden_states, residual, post, comb) with hc_post deferred to the next layer; the fork forward captures aux states and materializes the boundary streams from that tuple
  sha256: 39c77ae8d0ed88beb96d56093c0d4385d8f17648319d99e500de548b824180a9
  signature: '(self, positions: torch.Tensor, hidden_states: torch.Tensor, residual: torch.Tensor | None = None, post: torch.Tensor | None = None, comb: torch.Tensor | None = None) -> tuple[torch.Tensor, torch.Tensor | None, torch.Tensor | None, torch.Tensor | None]'

- id: glm-decoder-layer-hc-post
  kind: method
  target: vllm.models.glm5next.common.model:Glm5NextDecoderLayer.hc_post
  why: applies the deferred mHC post state without consuming it; used for aux capture and the pipeline boundary
  sha256: 28d25abf781d29fbf58ffe909dd6ea341c9756ddfb427862e987d2cc1cd9f0ba
  signature: '(self, x: torch.Tensor, residual: torch.Tensor, post: torch.Tensor, comb: torch.Tensor)'

- id: glm-mhc-contract
  kind: function
  target: vllm.model_executor.layers.mhc:hc_contract
  why: contracts the residual streams into the [tokens, hidden] aux hidden state
  sha256: 9437034b4e7185d4621c72bb36d99cbfff02d738c9bef42ee59948ce2af5ba5b
  signature: '(x: torch.Tensor, n: int) -> torch.Tensor'

- id: glm-eagle-pack-aux
  kind: method
  target: vllm.model_executor.models.interfaces:EagleModelMixin.pack_local_aux_hidden_states
  why: the fork backbone packs its stage's aux states into the boundary tensors under these keys
  sha256: 155345681f117e1d908d00295c44969cde4eecf25106f222c1a6c4c030f72543
