- id: glm-model-state-resolve
  kind: function
  target: vllm.v1.worker.gpu.model_states:resolve_model_state_cls
  why: a model with get_model_state_cls picks its own ModelState before the hybrid default; the fork GLM classes return Glm5NextModelState, a MambaHybridModelState subclass, which is what hybrid GLM gets otherwise
  sha256: c330e5807024a93a386d378275e87a317702f9ba54ba4aeeaa4d50085245cefc
